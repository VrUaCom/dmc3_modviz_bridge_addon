name: Android Toolchain Bootstrap

on:
  push:
    paths:
      - '.github/workflows/android-toolchain-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Install exact Native Reader Android toolchain
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Pack minimal x86_64 host toolchain
        run: |
          set -euxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/28.2.13676358"
          OUT="$RUNNER_TEMP/dmc-android-toolchain"
          mkdir -p "$OUT/sdk/platforms/android-36" "$OUT/sdk/build-tools/36.0.0" "$OUT/ndk"
          cp "$SDK/platforms/android-36/android.jar" "$OUT/sdk/platforms/android-36/"
          cp -a "$SDK/build-tools/36.0.0/aapt2" "$OUT/sdk/build-tools/36.0.0/"
          cp -a "$SDK/build-tools/36.0.0/zipalign" "$OUT/sdk/build-tools/36.0.0/"
          cp -a "$SDK/build-tools/36.0.0/apksigner" "$OUT/sdk/build-tools/36.0.0/"
          cp -a "$SDK/build-tools/36.0.0/d8" "$OUT/sdk/build-tools/36.0.0/"
          cp -a "$SDK/build-tools/36.0.0/lib" "$OUT/sdk/build-tools/36.0.0/"
          cp -a "$NDK/source.properties" "$OUT/ndk/"
          mkdir -p "$OUT/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          cp -a "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" "$OUT/ndk/toolchains/llvm/prebuilt/linux-x86_64/"
          CLANG_LIB="$(find "$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib/clang" -type f -name 'libclang_rt.builtins-aarch64-android.a' -print -quit)"
          test -n "$CLANG_LIB"
          mkdir -p "$OUT/ndk/compiler-rt"
          cp "$CLANG_LIB" "$OUT/ndk/compiler-rt/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dmc-android-toolchain.tar.gz" dmc-android-toolchain
          ls -lh "$RUNNER_TEMP/dmc-android-toolchain.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-android-toolchain-r28c
          path: ${{ runner.temp }}/dmc-android-toolchain.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
